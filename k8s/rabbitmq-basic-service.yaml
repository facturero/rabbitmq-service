apiVersion: v1
kind: Service
metadata:
  # El Service interno se llama `rabbitmq` (no `rabbitmq-basic`): los servicios lo resuelven
  # por `amqp://rabbitmq:5672`. Es ClusterIP porque nadie consume AMQP desde fuera del clúster;
  # la Management UI se mira con `kubectl port-forward svc/rabbitmq 15672:15672`.
  name: rabbitmq
  labels:
    app: rabbitmq-basic
spec:
  type: ClusterIP
  selector:
    app: rabbitmq-basic
  ports:
    - name: amqp
      protocol: TCP
      port: 5672
      targetPort: 5672
