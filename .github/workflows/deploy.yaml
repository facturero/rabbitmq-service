name: Deploy rabbitmq-basic to k3s

on:
  push:
    branches: [ "master" ]
    paths:
      - "k8s/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/rabbitmq-basic-pvc.yaml
          kubectl apply -f k8s/rabbitmq-config.yaml
          kubectl apply -f k8s/rabbitmq-basic-deployment.yaml
          kubectl apply -f k8s/rabbitmq-basic-service.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment rabbitmq-basic --timeout=180s
