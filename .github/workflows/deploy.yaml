name: Deploy rabbitmq-basic to k3s

on:
  push:
    branches: [ "master" ]
    paths:
      - "k8s/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create rabbitmq-basic secret
        run: |
          kubectl create secret generic rabbitmq-basic-credentials \
            --from-literal=user="${{ secrets.RABBITMQ_USER }}" \
            --from-literal=password="${{ secrets.RABBITMQ_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/rabbitmq-basic-pvc.yaml
          kubectl apply -f k8s/rabbitmq-basic-deployment.yaml
          kubectl apply -f k8s/rabbitmq-basic-service.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment rabbitmq-basic --timeout=120s
